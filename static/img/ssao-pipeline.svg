<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530">
<rect width="1100" height="530" rx="28" fill="#0c1320"/>
<text x="50" y="58" fill="#eef4ff" font-size="28" font-family="system-ui" font-weight="700">SSAO 完整数据流</text>
<g font-family="system-ui" text-anchor="middle">
<rect x="45" y="155" width="190" height="115" rx="18" fill="#152033" stroke="#365071"/><text x="140" y="192" fill="#fff" font-size="19">Geometry Pass</text><text x="140" y="225" fill="#9db0c7" font-size="15">G-Buffer</text><text x="140" y="248" fill="#9db0c7" font-size="15">Position / Normal / Albedo</text>
<rect x="315" y="135" width="210" height="155" rx="18" fill="#17243a" stroke="#4d78bb"/><text x="420" y="173" fill="#fff" font-size="19">SSAO Pass</text><text x="420" y="207" fill="#9db0c7" font-size="15">Hemisphere Kernel</text><text x="420" y="230" fill="#9db0c7" font-size="15">4×4 Noise Rotation</text><text x="420" y="253" fill="#9db0c7" font-size="15">Depth Compare + Range Check</text>
<rect x="605" y="155" width="180" height="115" rx="18" fill="#17243a" stroke="#4d78bb"/><text x="695" y="192" fill="#fff" font-size="19">Blur Pass</text><text x="695" y="225" fill="#9db0c7" font-size="15">去除 Noise Pattern</text><text x="695" y="248" fill="#9db0c7" font-size="15">得到平滑 AO</text>
<rect x="865" y="135" width="190" height="155" rx="18" fill="#183027" stroke="#4f9b70"/><text x="960" y="173" fill="#fff" font-size="19">Lighting Pass</text><text x="960" y="210" fill="#b5d8c1" font-size="15">ambient = 0.3</text><text x="960" y="233" fill="#b5d8c1" font-size="15">× Albedo</text><text x="960" y="256" fill="#b5d8c1" font-size="15">× AO</text>
</g>
<g stroke="#7fa9e7" stroke-width="4"><line x1="235" y1="212" x2="315" y2="212"/><line x1="525" y1="212" x2="605" y2="212"/><line x1="785" y1="212" x2="865" y2="212"/></g>
<text x="50" y="365" fill="#dce8f8" font-size="19" font-family="system-ui">AO Texture 的值：</text><text x="245" y="365" fill="#8fd3a9" font-size="19" font-family="monospace">1.0 = 不遮挡 → Ambient 保留</text><text x="575" y="365" fill="#ef9d8c" font-size="19" font-family="monospace">0.0 = 强遮挡 → Ambient 被压低</text>
<text x="50" y="420" fill="#98aabd" font-size="17" font-family="system-ui">SSAO 不是阴影贴图，也不是直接光照遮挡。它只是在屏幕空间估计“环境光有多少能进来”，所以通常只乘到 Ambient 项。</text>
</svg>