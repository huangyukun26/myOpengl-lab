<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#8fb8ff"/></marker></defs>
<rect width="1100" height="620" rx="28" fill="url(#bg)"/>
<text x="50" y="58" fill="#eef4ff" font-size="28" font-family="system-ui" font-weight="700">SSAO：为什么要把 Sample 投影回屏幕？</text>
<rect x="75" y="130" width="270" height="350" rx="20" fill="#151f2d" stroke="#30425c"/>
<text x="110" y="170" fill="#dce8f8" font-size="20" font-family="system-ui">View Space</text>
<circle cx="165" cy="370" r="10" fill="#fff"/>
<circle cx="250" cy="285" r="10" fill="#8fb8ff"/>
<line x1="165" y1="370" x2="250" y2="285" stroke="#8fb8ff" stroke-width="4" marker-end="url(#arr)"/>
<text x="105" y="420" fill="#a9b9cc" font-size="16" font-family="system-ui">fragPos</text><text x="235" y="260" fill="#a9b9cc" font-size="16" font-family="system-ui">samplePos</text>
<text x="425" y="190" fill="#dce8f8" font-size="20" font-family="system-ui">Projection</text>
<text x="408" y="230" fill="#9eafc4" font-size="16" font-family="system-ui">samplePos</text><text x="445" y="260" fill="#8fb8ff" font-size="24" font-family="system-ui">→ clip → NDC → UV</text>
<line x1="350" y1="305" x2="660" y2="305" stroke="#8fb8ff" stroke-width="4" marker-end="url(#arr)"/>
<rect x="705" y="120" width="320" height="380" rx="20" fill="#151f2d" stroke="#30425c"/>
<text x="735" y="160" fill="#dce8f8" font-size="20" font-family="system-ui">gPosition Texture</text>
<rect x="755" y="200" width="220" height="220" fill="#233149"/>
<circle cx="874" cy="304" r="10" fill="#8fb8ff"/>
<circle cx="850" cy="330" r="10" fill="#f4b66f"/>
<line x1="850" y1="330" x2="874" y2="304" stroke="#f4b66f" stroke-width="3"/>
<text x="742" y="457" fill="#dce8f8" font-size="17" font-family="system-ui">在 offset.xy 位置读取：</text>
<text x="742" y="487" fill="#8fb8ff" font-size="17" font-family="monospace">sampleDepth = texture(gPosition, offset.xy).z</text>
<text x="78" y="555" fill="#9fb0c4" font-size="17" font-family="system-ui">关键：Sample 是 3D View-Space 点，但 G-Buffer 是 2D 屏幕纹理，所以必须先把 Sample 投影成 UV，才能查“屏幕上那里真正看见的表面深度”。</text>
</svg>