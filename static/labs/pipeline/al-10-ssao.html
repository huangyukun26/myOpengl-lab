<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSAO · Pipeline</title>
<style>:root{color-scheme:light dark;--p:#fff;--c:#f7f9fc;--t:#172033;--m:#687386;--b:#d8e0ea;--a:#6a79d8}@media(prefers-color-scheme:dark){:root{--p:#151b23;--c:#10161e;--t:#e6edf3;--m:#98a4b5;--b:#303a49}}*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--t);font-family:Inter,system-ui,sans-serif}.w{max-width:1080px;margin:auto;padding:8px}.card{border:1px solid var(--b);background:var(--p);border-radius:16px;padding:16px}.title{font-size:13px;font-weight:700;margin-bottom:14px}.flow{display:grid;grid-template-columns:1fr auto 1.2fr auto 1fr auto 1.15fr;gap:8px;align-items:center}.box{border:1px solid var(--b);background:var(--c);border-radius:12px;padding:13px;text-align:center}.hot{border-color:var(--a)}.box b{display:block;font-size:13px}.box span{display:block;font-size:11px;color:var(--m);line-height:1.5;margin-top:5px}.arr{color:var(--a);font-size:19px}.note{margin-top:12px;color:var(--m);font-size:12px;line-height:1.7}@media(max-width:760px){.flow{grid-template-columns:1fr}.arr{text-align:center;transform:rotate(90deg)}}</style></head><body>
<div class="w"><section class="card"><div class="title">SSAO · Deferred Pipeline 中的位置</div><div class="flow"><div class="box"><b>G-Buffer</b><span>View Position · Normal · Albedo</span></div><div class="arr">→</div><div class="box hot"><b>SSAO Pass</b><span>Hemisphere · Noise · Depth Compare</span></div><div class="arr">→</div><div class="box hot"><b>Blur</b><span>Raw AO → Smooth AO</span></div><div class="arr">→</div><div class="box"><b>Lighting</b><span>Ambient × AO</span></div></div><div class="note">SSAO 不替代 Shadow Mapping。它根据屏幕空间邻域估计环境光遮蔽，只压低 Ambient / Indirect 部分。</div></section></div></body></html>
