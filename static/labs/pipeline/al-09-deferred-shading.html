<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deferred Shading · Pipeline</title><style>:root{color-scheme:light dark;--p:#fff;--c:#f7f9fc;--t:#172033;--m:#687386;--b:#d8e0ea;--a:#4f8bd8}@media(prefers-color-scheme:dark){:root{--p:#151b23;--c:#10161e;--t:#e6edf3;--m:#98a4b5;--b:#303a49}}*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--t);font-family:Inter,system-ui,sans-serif}.w{max-width:1080px;margin:auto;padding:8px}.card{border:1px solid var(--b);background:var(--p);border-radius:16px;padding:16px}.title{font-size:13px;font-weight:700;margin-bottom:14px}.flow{display:grid;grid-template-columns:1fr auto 1.35fr auto 1fr;gap:8px;align-items:center}.box{border:1px solid var(--b);background:var(--c);border-radius:12px;padding:13px;text-align:center}.hot{border-color:var(--a)}.box b{display:block;font-size:13px}.box span{display:block;font-size:11px;color:var(--m);line-height:1.5;margin-top:5px}.arr{color:var(--a);font-size:19px}.gb{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.mini{border:1px dashed var(--b);border-radius:8px;padding:6px;font-size:10px;color:var(--m)}.note{margin-top:12px;color:var(--m);font-size:12px;line-height:1.7}@media(max-width:760px){.flow{grid-template-columns:1fr}.arr{text-align:center;transform:rotate(90deg)}.gb{grid-template-columns:1fr}}</style></head><body><div class="w"><section class="card"><div class="title">Deferred Shading · 两阶段着色</div><div class="flow"><div class="box"><b>Geometry Pass</b><span>光栅化最终可见表面</span></div><div class="arr">→</div><div class="box hot"><b>G-Buffer / MRT</b><div class="gb"><div class="mini">Position</div><div class="mini">Normal</div><div class="mini">Albedo + Spec</div></div></div><div class="arr">→</div><div class="box hot"><b>Lighting Pass</b><span>Fullscreen Quad · 多光源</span></div></div><div class="note">第一遍不算最终光照，只把后面需要的几何与材质信息写进 G-Buffer；第二遍逐屏幕像素读取这些纹理再统一计算光照。</div></section></div></body></html>
