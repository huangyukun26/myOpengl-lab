<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloom · Pipeline</title>
<style>:root{color-scheme:light dark;--p:#fff;--c:#f7f9fc;--t:#172033;--m:#687386;--b:#d8e0ea;--a:#d65caa}@media(prefers-color-scheme:dark){:root{--p:#151b23;--c:#10161e;--t:#e6edf3;--m:#98a4b5;--b:#303a49}}*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--t);font-family:Inter,system-ui,sans-serif}.w{max-width:1080px;margin:auto;padding:8px}.card{border:1px solid var(--b);background:var(--p);border-radius:16px;padding:16px}.title{font-size:13px;font-weight:700;margin-bottom:14px}.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;gap:8px;align-items:center}.box{border:1px solid var(--b);background:var(--c);border-radius:12px;padding:13px;text-align:center}.hot{border-color:var(--a)}.box b{display:block;font-size:13px}.box span{display:block;font-size:11px;color:var(--m);line-height:1.5;margin-top:5px}.arr{color:var(--a);font-size:19px}.note{margin-top:12px;color:var(--m);font-size:12px;line-height:1.7}@media(max-width:760px){.flow{grid-template-columns:1fr}.arr{text-align:center;transform:rotate(90deg)}}</style></head><body><div class="w"><section class="card"><div class="title">Bloom · HDR 后处理链</div><div class="flow"><div class="box"><b>HDR Lighting</b><span>线性颜色允许 > 1</span></div><div class="arr">→</div><div class="box hot"><b>MRT Bright Pass</b><span>Scene + Bright</span></div><div class="arr">→</div><div class="box hot"><b>Ping-Pong Blur</b><span>Horizontal ↔ Vertical</span></div><div class="arr">→</div><div class="box"><b>Composite</b><span>Scene + Bloom → Tone Map</span></div></div><div class="note">先提取高亮，只模糊 Bright Texture，再加回原 HDR Scene。Bloom 位于 HDR 与 Tone Mapping 之间。</div></section></div></body></html>
