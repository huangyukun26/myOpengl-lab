<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Point Shadows Lab</title>
<style>
:root{color-scheme:light dark;--bg:#f5f7fa;--panel:#fff;--card:#f8fafc;--text:#172033;--muted:#667085;--border:#d9e1eb;--accent:#4a8bd8}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#151b23;--card:#10161e;--text:#e6edf3;--muted:#98a4b5;--border:#303a49}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end}.head h1{font-size:22px;margin:0}.head p{font-size:13px;color:var(--muted);margin:5px 0 0}
.tabs,.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tabs button,.controls button{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:9px;padding:8px 11px;cursor:pointer}.tabs button.active,.controls button.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.stage{margin-top:14px;border:1px solid var(--border);background:var(--panel);border-radius:16px;padding:14px}
.canvasWrap{position:relative}canvas{display:block;width:100%;aspect-ratio:16/8;border-radius:12px;background:#0c1017;cursor:grab;touch-action:none}canvas:active{cursor:grabbing}.depthLabels{position:absolute;inset:0;pointer-events:none}.depthLabels span{position:absolute;padding:4px 8px;border-radius:7px;background:rgba(10,14,20,.72);color:#fff;font-size:12px;font-weight:700;transform:translate(10px,10px)}
.controls{margin-top:12px}.ctl{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--card);border-radius:9px;padding:7px 9px;font-size:12px;color:var(--muted)}.ctl input{width:145px}.ctl span{min-width:48px;text-align:right;color:var(--text)}

.info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.card{border:1px solid var(--border);background:var(--panel);border-radius:14px;padding:14px}.card h2{font-size:15px;margin:0 0 8px}.card p,.card pre{font-size:12px;line-height:1.7;color:var(--muted);margin:0}.card pre{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--card);border:1px solid var(--border);padding:10px;border-radius:10px;margin-top:8px}
@media(max-width:760px){.head{align-items:flex-start;flex-direction:column}.info{grid-template-columns:1fr}.ctl input{width:100px}}
</style></head><body><div class="wrap">
<div class="head">
<div><h1>Point Shadows Lab</h1><p>拖拽旋转视角，滚轮缩放。Depth Cubemap 模式同时显示六个方向。</p></div>
<div class="tabs">
<button class="tab active" data-mode="final">最终阴影</button>
<button class="tab" data-mode="depth">Depth Cubemap</button>
<button class="tab" data-mode="test">Shadow Test</button>
</div>
</div>

<section class="stage">
<div class="canvasWrap">
<canvas id="gl" width="1200" height="600"></canvas>
<div id="depthLabels" class="depthLabels" hidden>
  <span data-slot="0">+X</span><span data-slot="1">-X</span><span data-slot="2">+Y</span>
  <span data-slot="3">-Y</span><span data-slot="4">+Z</span><span data-slot="5">-Z</span>
</div>
</div>
<div class="controls">
<label class="ctl">Bias <input id="bias" type="range" min="0" max="0.30" step="0.01" value="0.08"><span id="biasVal">0.08</span></label>
<label class="ctl">光源 X <input id="lightX" type="range" min="-2.5" max="2.5" step="0.1" value="0"><span id="lightXVal">0.0</span></label>
<button id="soft" class="active">Soft PCF</button>
<button id="shadows" class="active">Shadows ON</button>
<button id="animate">移动光源</button>
</div>

</section>

<div class="info">
<section class="card"><h2 id="modeTitle">最终阴影</h2><p id="modeText">红色和蓝色立方体分别位于点光源两侧，阴影随光源位置变化。</p><pre>fragToLight = fragPos - lightPos
direction → sample cubemap
length    → currentDepth</pre></section>
<section class="card"><h2>Depth Cubemap</h2><p>六个小视图对应 +X、-X、+Y、-Y、+Z、-Z。灰度越亮，表示该方向上的最近表面离光源越远；深色区域表示该方向没有几何写入有效深度。</p></section>
</div>
</div><script src="point-shadows.js?v=3"></script></body></html>
