<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="470" viewBox="0 0 1700 470" role="img" aria-labelledby="title desc">
  <title id="title">OpenGL Rendering Pipeline learning map</title>
  <desc id="desc">Simplified OpenGL pipeline with Framebuffer as the current chapter; Face Culling and Blending are learned chapters.</desc>
  <defs><style>
    .bg{fill:#0d1117}.box{fill:#161b22;stroke:#30363d;stroke-width:2}.learned{fill:#12241d;stroke:#3fb950;stroke-width:2.5}.current{fill:#0d2740;stroke:#58a6ff;stroke-width:3}.group{fill:#111820;stroke:#30363d;stroke-width:2;stroke-dasharray:7 7}.t{fill:#e6edf3;font:600 21px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:#8b949e;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}.ct{fill:#79c0ff;font:700 21px system-ui,-apple-system,"Segoe UI",sans-serif}.lt{fill:#56d364;font:700 19px system-ui,-apple-system,"Segoe UI",sans-serif}.line{stroke:#6e7681;stroke-width:3;fill:none}.arrow{fill:#6e7681}.tagCurrent{fill:#58a6ff;font:700 13px system-ui}.tagLearned{fill:#3fb950;font:700 12px system-ui}.note{fill:#79c0ff;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
  </style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker></defs>
  <rect class="bg" width="1700" height="470" rx="24"/>
  <text x="50" y="52" class="t">OpenGL Rendering Pipeline · learning map</text><text x="50" y="80" class="s">Framebuffer is the render target: binding another FBO redirects final writes into its attachments.</text>
  <rect x="40" y="145" width="140" height="82" rx="14" class="box"/><text x="110" y="179" text-anchor="middle" class="t">Vertex Data</text><text x="110" y="204" text-anchor="middle" class="s">VAO / VBO</text>
  <path d="M180 186H215" class="line" marker-end="url(#arrow)"/><rect x="225" y="145" width="160" height="82" rx="14" class="box"/><text x="305" y="179" text-anchor="middle" class="t">Vertex Shader</text><text x="305" y="204" text-anchor="middle" class="s">clip position</text>
  <path d="M385 186H420" class="line" marker-end="url(#arrow)"/><rect x="430" y="145" width="155" height="82" rx="14" class="box"/><text x="508" y="179" text-anchor="middle" class="t">Assembly</text><text x="508" y="204" text-anchor="middle" class="s">triangles</text>
  <path d="M585 186H620" class="line" marker-end="url(#arrow)"/><rect x="630" y="139" width="185" height="94" rx="14" class="learned"/><text x="723" y="176" text-anchor="middle" class="lt">Face Culling</text><text x="723" y="202" text-anchor="middle" class="s">winding → drop triangle</text><text x="756" y="156" class="tagLearned">LEARNED</text>
  <path d="M815 186H850" class="line" marker-end="url(#arrow)"/><rect x="860" y="145" width="165" height="82" rx="14" class="box"/><text x="943" y="179" text-anchor="middle" class="t">Rasterization</text><text x="943" y="204" text-anchor="middle" class="s">fragments</text>
  <path d="M1025 186H1060" class="line" marker-end="url(#arrow)"/><rect x="1070" y="145" width="190" height="82" rx="14" class="box"/><text x="1165" y="179" text-anchor="middle" class="t">Fragment Shader</text><text x="1165" y="204" text-anchor="middle" class="s">src color</text>
  <path d="M1260 186H1300V298H1130" class="line" marker-end="url(#arrow)"/>
  <rect x="650" y="278" width="520" height="120" rx="18" class="group"/><text x="675" y="308" class="s">Per-sample operations</text>
  <rect x="675" y="325" width="125" height="48" rx="11" class="box"/><text x="738" y="355" text-anchor="middle" class="s">Stencil</text><path d="M800 349H830" class="line" marker-end="url(#arrow)"/>
  <rect x="840" y="325" width="125" height="48" rx="11" class="box"/><text x="903" y="355" text-anchor="middle" class="s">Depth</text><path d="M965 349H995" class="line" marker-end="url(#arrow)"/>
  <rect x="1005" y="318" width="150" height="62" rx="12" class="learned"/><text x="1080" y="353" text-anchor="middle" class="lt">Blending</text><text x="1100" y="335" class="tagLearned">LEARNED</text>
  <path d="M1155 349H1205" class="line" marker-end="url(#arrow)"/>
  <rect x="1215" y="298" width="235" height="102" rx="15" class="current"/><text x="1333" y="335" text-anchor="middle" class="ct">Framebuffer Target</text><text x="1333" y="362" text-anchor="middle" class="s">color / depth / stencil attachments</text><text x="1380" y="317" class="tagCurrent">CURRENT</text>
  <path d="M1450 349H1495" class="line" marker-end="url(#arrow)"/><rect x="1505" y="306" width="155" height="86" rx="14" class="box"/><text x="1583" y="340" text-anchor="middle" class="t">Next Pass</text><text x="1583" y="366" text-anchor="middle" class="s">sample texture</text>
  <text x="1218" y="426" class="note">glBindFramebuffer(...) chooses where this pass writes.</text>
</svg>
