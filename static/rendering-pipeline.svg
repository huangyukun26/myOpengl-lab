<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="560" viewBox="0 0 1800 560" role="img" aria-labelledby="title desc">
  <title id="title">OpenGL Rendering Pipeline learning map</title>
  <desc id="desc">Geometry Shader is highlighted between primitive assembly and rasterization. Advanced GLSL, UBO, Cubemap, Blending and Framebuffer are learned topics.</desc>
  <defs><style>
    .bg{fill:#0d1117}.box{fill:#161b22;stroke:#30363d;stroke-width:2}.learned{fill:#12241d;stroke:#3fb950;stroke-width:2.5}.current{fill:#0d2740;stroke:#58a6ff;stroke-width:3}.group{fill:#111820;stroke:#30363d;stroke-width:2;stroke-dasharray:7 7}.t{fill:#e6edf3;font:600 21px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:#8b949e;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}.ct{fill:#79c0ff;font:700 21px system-ui,-apple-system,"Segoe UI",sans-serif}.lt{fill:#56d364;font:700 19px system-ui,-apple-system,"Segoe UI",sans-serif}.line{stroke:#6e7681;stroke-width:3;fill:none}.dash{stroke:#58a6ff;stroke-width:2.5;stroke-dasharray:7 6;fill:none}.arrow{fill:#6e7681}.blueArrow{fill:#58a6ff}.tagCurrent{fill:#58a6ff;font:700 13px system-ui}.tagLearned{fill:#3fb950;font:700 12px system-ui}.note{fill:#79c0ff;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
  </style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="barrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="blueArrow"/></marker></defs>
  <rect class="bg" width="1800" height="560" rx="24"/>
  <text x="50" y="52" class="t">OpenGL Rendering Pipeline · learning map</text>
  <text x="50" y="80" class="s">Geometry Shader works on a complete primitive and may emit new points, lines or triangles before rasterization.</text>

  <rect x="35" y="170" width="155" height="82" rx="14" class="learned"/><text x="112" y="204" text-anchor="middle" class="lt">Vertex Data</text><text x="112" y="229" text-anchor="middle" class="s">VAO / VBO</text>
  <path d="M190 211H220" class="line" marker-end="url(#arrow)"/>
  <rect x="230" y="164" width="185" height="94" rx="14" class="learned"/><text x="323" y="201" text-anchor="middle" class="lt">Vertex Shader</text><text x="323" y="227" text-anchor="middle" class="s">one vertex at a time</text><text x="347" y="181" class="tagLearned">LEARNED</text>
  <path d="M415 211H450" class="line" marker-end="url(#arrow)"/>
  <rect x="460" y="170" width="180" height="82" rx="14" class="box"/><text x="550" y="204" text-anchor="middle" class="t">Assembly</text><text x="550" y="229" text-anchor="middle" class="s">point / line / triangle</text>
  <path d="M640 211H675" class="dash" marker-end="url(#barrow)"/>
  <rect x="685" y="146" width="250" height="130" rx="17" class="current"/><text x="810" y="188" text-anchor="middle" class="ct">Geometry Shader</text><text x="810" y="218" text-anchor="middle" class="s">gl_in[] · whole primitive</text><text x="810" y="244" text-anchor="middle" class="s">EmitVertex · EndPrimitive</text><text x="865" y="167" class="tagCurrent">CURRENT</text>
  <path d="M935 211H970" class="dash" marker-end="url(#barrow)"/>
  <rect x="980" y="170" width="170" height="82" rx="14" class="box"/><text x="1065" y="204" text-anchor="middle" class="t">Rasterization</text><text x="1065" y="229" text-anchor="middle" class="s">fragments</text>
  <path d="M1150 211H1185" class="line" marker-end="url(#arrow)"/>
  <rect x="1195" y="164" width="200" height="94" rx="14" class="learned"/><text x="1295" y="201" text-anchor="middle" class="lt">Fragment Shader</text><text x="1295" y="227" text-anchor="middle" class="s">color / depth</text><text x="1327" y="181" class="tagLearned">LEARNED</text>
  <path d="M1395 211H1430V360H1440" class="line" marker-end="url(#arrow)"/>
  <rect x="1440" y="302" width="315" height="120" rx="18" class="group"/><text x="1465" y="332" class="s">Per-sample operations</text>
  <rect x="1465" y="350" width="95" height="48" rx="11" class="box"/><text x="1512" y="380" text-anchor="middle" class="s">Depth</text><path d="M1560 374H1585" class="line" marker-end="url(#arrow)"/>
  <rect x="1595" y="343" width="125" height="62" rx="12" class="learned"/><text x="1658" y="378" text-anchor="middle" class="lt">Blending</text>

  <rect x="245" y="330" width="420" height="110" rx="15" class="learned"/><text x="270" y="361" class="lt">Advanced GLSL / UBO</text><text x="270" y="390" class="s">built-ins · interface blocks · std140</text><text x="270" y="417" class="s">shared uniform buffer</text><text x="575" y="350" class="tagLearned">LEARNED</text>
  <path d="M330 330V278" class="line" marker-end="url(#arrow)"/>

  <rect x="720" y="330" width="520" height="115" rx="15" class="current"/><text x="745" y="360" class="ct">Geometry Shader · primitive transformation</text><text x="745" y="390" class="s">point → house · triangle → exploded triangle · triangle → normal lines</text><text x="745" y="418" class="note">Input and output primitive types are declared explicitly in GLSL.</text>
  <path d="M810 330V292" class="dash" marker-end="url(#barrow)"/>

  <rect x="1260" y="330" width="150" height="90" rx="14" class="learned"/><text x="1335" y="365" text-anchor="middle" class="lt">Cubemap</text><text x="1335" y="392" text-anchor="middle" class="s">resource</text>
  <text x="70" y="500" class="s">Vertex Shader changes vertices. Geometry Shader receives an assembled primitive and can change primitive count or primitive type.</text>
  <text x="70" y="528" class="note">Desktop OpenGL supports Geometry Shader; WebGL2 does not expose this stage, so the browser lab visualizes its exact primitive I/O semantics.</text>
</svg>