<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="540" viewBox="0 0 1800 540" role="img" aria-labelledby="title desc">
  <title id="title">OpenGL Rendering Pipeline learning map</title>
  <desc id="desc">Simplified OpenGL pipeline with Cubemap Texture as the current sampled resource connected to the Fragment Shader; Face Culling, Blending and Framebuffer are learned topics.</desc>
  <defs><style>
    .bg{fill:#0d1117}.box{fill:#161b22;stroke:#30363d;stroke-width:2}.learned{fill:#12241d;stroke:#3fb950;stroke-width:2.5}.current{fill:#0d2740;stroke:#58a6ff;stroke-width:3}.group{fill:#111820;stroke:#30363d;stroke-width:2;stroke-dasharray:7 7}.t{fill:#e6edf3;font:600 21px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:#8b949e;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}.ct{fill:#79c0ff;font:700 21px system-ui,-apple-system,"Segoe UI",sans-serif}.lt{fill:#56d364;font:700 19px system-ui,-apple-system,"Segoe UI",sans-serif}.line{stroke:#6e7681;stroke-width:3;fill:none}.dash{stroke:#58a6ff;stroke-width:2.5;stroke-dasharray:7 6;fill:none}.arrow{fill:#6e7681}.blueArrow{fill:#58a6ff}.tagCurrent{fill:#58a6ff;font:700 13px system-ui}.tagLearned{fill:#3fb950;font:700 12px system-ui}.note{fill:#79c0ff;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
  </style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="barrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="blueArrow"/></marker></defs>
  <rect class="bg" width="1800" height="540" rx="24"/>
  <text x="50" y="52" class="t">OpenGL Rendering Pipeline · learning map</text><text x="50" y="80" class="s">Cubemap is not a new pipeline stage: it is a texture resource sampled by shaders with a vec3 direction.</text>

  <rect x="40" y="170" width="140" height="82" rx="14" class="box"/><text x="110" y="204" text-anchor="middle" class="t">Vertex Data</text><text x="110" y="229" text-anchor="middle" class="s">VAO / VBO</text>
  <path d="M180 211H215" class="line" marker-end="url(#arrow)"/><rect x="225" y="170" width="160" height="82" rx="14" class="box"/><text x="305" y="204" text-anchor="middle" class="t">Vertex Shader</text><text x="305" y="229" text-anchor="middle" class="s">clip position</text>
  <path d="M385 211H420" class="line" marker-end="url(#arrow)"/><rect x="430" y="170" width="155" height="82" rx="14" class="box"/><text x="508" y="204" text-anchor="middle" class="t">Assembly</text><text x="508" y="229" text-anchor="middle" class="s">triangles</text>
  <path d="M585 211H620" class="line" marker-end="url(#arrow)"/><rect x="630" y="164" width="185" height="94" rx="14" class="learned"/><text x="723" y="201" text-anchor="middle" class="lt">Face Culling</text><text x="723" y="227" text-anchor="middle" class="s">winding → drop triangle</text><text x="756" y="181" class="tagLearned">LEARNED</text>
  <path d="M815 211H850" class="line" marker-end="url(#arrow)"/><rect x="860" y="170" width="165" height="82" rx="14" class="box"/><text x="943" y="204" text-anchor="middle" class="t">Rasterization</text><text x="943" y="229" text-anchor="middle" class="s">fragments</text>
  <path d="M1025 211H1060" class="line" marker-end="url(#arrow)"/><rect x="1070" y="170" width="200" height="82" rx="14" class="box"/><text x="1170" y="204" text-anchor="middle" class="t">Fragment Shader</text><text x="1170" y="229" text-anchor="middle" class="s">texture sampling / src color</text>

  <rect x="1060" y="304" width="225" height="105" rx="15" class="current"/><text x="1173" y="341" text-anchor="middle" class="ct">Cubemap Texture</text><text x="1173" y="369" text-anchor="middle" class="s">samplerCube(direction vec3)</text><text x="1210" y="323" class="tagCurrent">CURRENT</text>
  <path d="M1173 304V266" class="dash" marker-end="url(#barrow)"/><text x="1190" y="288" class="note">shader resource</text>

  <path d="M1270 211H1310V360H1305" class="line" marker-end="url(#arrow)"/>
  <rect x="1305" y="302" width="330" height="120" rx="18" class="group"/><text x="1330" y="332" class="s">Per-sample operations</text>
  <rect x="1330" y="350" width="105" height="48" rx="11" class="box"/><text x="1383" y="380" text-anchor="middle" class="s">Depth</text><path d="M1435 374H1462" class="line" marker-end="url(#arrow)"/>
  <rect x="1472" y="343" width="140" height="62" rx="12" class="learned"/><text x="1542" y="378" text-anchor="middle" class="lt">Blending</text><text x="1558" y="360" class="tagLearned">LEARNED</text>
  <path d="M1612 374H1640" class="line" marker-end="url(#arrow)"/>
  <rect x="1650" y="331" width="125" height="86" rx="14" class="learned"/><text x="1713" y="365" text-anchor="middle" class="lt">FBO</text><text x="1713" y="391" text-anchor="middle" class="s">attachments</text><text x="1728" y="349" class="tagLearned">LEARNED</text>

  <text x="70" y="475" class="s">Skybox: direction = cube position · Reflection: direction = reflect(I, N) · Refraction: direction = refract(I, N, eta)</text>
  <text x="70" y="503" class="note">The chapter changes what the Fragment Shader samples, not the fixed-function order of the pipeline.</text>
</svg>
