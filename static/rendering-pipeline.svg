<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="450" viewBox="0 0 1600 450" role="img" aria-labelledby="title desc">
  <title id="title">OpenGL Rendering Pipeline learning map</title>
  <desc id="desc">Simplified OpenGL pipeline with Face Culling as the current chapter and Blending as a learned chapter.</desc>
  <defs><style>
    .bg{fill:#0d1117}.box{fill:#161b22;stroke:#30363d;stroke-width:2}.learned{fill:#12241d;stroke:#3fb950;stroke-width:2.5}.current{fill:#0d2740;stroke:#58a6ff;stroke-width:3}.group{fill:#111820;stroke:#30363d;stroke-width:2;stroke-dasharray:7 7}.t{fill:#e6edf3;font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:#8b949e;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}.ct{fill:#79c0ff;font:700 21px system-ui,-apple-system,"Segoe UI",sans-serif}.lt{fill:#56d364;font:700 20px system-ui,-apple-system,"Segoe UI",sans-serif}.line{stroke:#6e7681;stroke-width:3;fill:none}.arrow{fill:#6e7681}.tagCurrent{fill:#58a6ff;font:700 13px system-ui}.tagLearned{fill:#3fb950;font:700 12px system-ui}
  </style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker></defs>
  <rect class="bg" width="1600" height="450" rx="24"/>
  <text x="50" y="52" class="t">OpenGL Rendering Pipeline · learning map</text><text x="50" y="80" class="s">LearnOpenGL order stays intact; each finished chapter is mapped back onto the GPU pipeline.</text>
  <rect x="45" y="145" width="145" height="82" rx="14" class="box"/><text x="118" y="179" text-anchor="middle" class="t">Vertex Data</text><text x="118" y="204" text-anchor="middle" class="s">VAO / VBO</text>
  <path d="M190 186H225" class="line" marker-end="url(#arrow)"/><rect x="235" y="145" width="165" height="82" rx="14" class="box"/><text x="318" y="179" text-anchor="middle" class="t">Vertex Shader</text><text x="318" y="204" text-anchor="middle" class="s">clip position</text>
  <path d="M400 186H435" class="line" marker-end="url(#arrow)"/><rect x="445" y="145" width="165" height="82" rx="14" class="box"/><text x="528" y="179" text-anchor="middle" class="t">Assembly</text><text x="528" y="204" text-anchor="middle" class="s">triangles</text>
  <path d="M610 186H645" class="line" marker-end="url(#arrow)"/><rect x="655" y="136" width="190" height="100" rx="14" class="current"/><text x="750" y="176" text-anchor="middle" class="ct">Face Culling</text><text x="750" y="204" text-anchor="middle" class="s">winding → drop triangle</text><text x="792" y="154" class="tagCurrent">CURRENT</text>
  <path d="M845 186H880" class="line" marker-end="url(#arrow)"/><rect x="890" y="145" width="170" height="82" rx="14" class="box"/><text x="975" y="179" text-anchor="middle" class="t">Rasterization</text><text x="975" y="204" text-anchor="middle" class="s">fragments</text>
  <path d="M1060 186H1095" class="line" marker-end="url(#arrow)"/><rect x="1105" y="145" width="195" height="82" rx="14" class="box"/><text x="1203" y="179" text-anchor="middle" class="t">Fragment Shader</text><text x="1203" y="204" text-anchor="middle" class="s">src color</text>
  <path d="M1300 186H1340V296H1160" class="line" marker-end="url(#arrow)"/>
  <rect x="650" y="275" width="525" height="120" rx="18" class="group"/><text x="675" y="305" class="s">Per-sample operations</text>
  <rect x="675" y="322" width="125" height="48" rx="11" class="box"/><text x="738" y="352" text-anchor="middle" class="s">Stencil</text><path d="M800 346H830" class="line" marker-end="url(#arrow)"/>
  <rect x="840" y="322" width="125" height="48" rx="11" class="box"/><text x="903" y="352" text-anchor="middle" class="s">Depth</text><path d="M965 346H995" class="line" marker-end="url(#arrow)"/>
  <rect x="1005" y="315" width="150" height="62" rx="12" class="learned"/><text x="1080" y="350" text-anchor="middle" class="lt">Blending</text><text x="1100" y="332" class="tagLearned">LEARNED</text>
  <path d="M1155 346H1210" class="line" marker-end="url(#arrow)"/><rect x="1220" y="303" width="160" height="86" rx="14" class="box"/><text x="1300" y="338" text-anchor="middle" class="t">Framebuffer</text><text x="1300" y="365" text-anchor="middle" class="s">color / depth</text>
</svg>
