<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="560" viewBox="0 0 1800 560" role="img" aria-labelledby="title desc">
<title id="title">OpenGL Rendering Pipeline learning map</title>
<desc id="desc">Instancing is highlighted as a data submission pattern feeding the vertex stage: one mesh plus per-instance attributes, driven by one instanced draw call.</desc>
<defs><style>
.bg{fill:#0d1117}.box{fill:#161b22;stroke:#30363d;stroke-width:2}.learned{fill:#12241d;stroke:#3fb950;stroke-width:2.5}.current{fill:#0d2740;stroke:#58a6ff;stroke-width:3}.group{fill:#111820;stroke:#30363d;stroke-width:2;stroke-dasharray:7 7}.t{fill:#e6edf3;font:600 21px system-ui,-apple-system,"Segoe UI",sans-serif}.s{fill:#8b949e;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}.ct{fill:#79c0ff;font:700 21px system-ui,-apple-system,"Segoe UI",sans-serif}.lt{fill:#56d364;font:700 19px system-ui,-apple-system,"Segoe UI",sans-serif}.line{stroke:#6e7681;stroke-width:3;fill:none}.dash{stroke:#58a6ff;stroke-width:2.5;stroke-dasharray:7 6;fill:none}.arrow{fill:#6e7681}.blueArrow{fill:#58a6ff}.tagCurrent{fill:#58a6ff;font:700 13px system-ui}.tagLearned{fill:#3fb950;font:700 12px system-ui}.note{fill:#79c0ff;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="barrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="blueArrow"/></marker></defs>
<rect class="bg" width="1800" height="560" rx="24"/>
<text x="50" y="52" class="t">OpenGL Rendering Pipeline · learning map</text>
<text x="50" y="80" class="s">Instancing does not add a new pipeline stage; it changes how repeated mesh data and per-instance data are submitted to the vertex stage.</text>

<rect x="35" y="170" width="180" height="82" rx="14" class="learned"/><text x="125" y="204" text-anchor="middle" class="lt">Vertex Data</text><text x="125" y="229" text-anchor="middle" class="s">VAO / VBO</text>
<path d="M215 211H250" class="line" marker-end="url(#arrow)"/>
<rect x="260" y="158" width="205" height="106" rx="14" class="learned"/><text x="362" y="197" text-anchor="middle" class="lt">Vertex Shader</text><text x="362" y="225" text-anchor="middle" class="s">gl_InstanceID</text><text x="395" y="178" class="tagLearned">LEARNED</text>
<path d="M465 211H500" class="line" marker-end="url(#arrow)"/>
<rect x="510" y="170" width="165" height="82" rx="14" class="box"/><text x="592" y="204" text-anchor="middle" class="t">Assembly</text><text x="592" y="229" text-anchor="middle" class="s">primitive</text>
<path d="M675 211H710" class="line" marker-end="url(#arrow)"/>
<rect x="720" y="158" width="220" height="106" rx="14" class="learned"/><text x="830" y="197" text-anchor="middle" class="lt">Geometry Shader</text><text x="830" y="225" text-anchor="middle" class="s">primitive processing</text><text x="867" y="178" class="tagLearned">LEARNED</text>
<path d="M940 211H975" class="line" marker-end="url(#arrow)"/>
<rect x="985" y="170" width="170" height="82" rx="14" class="box"/><text x="1070" y="204" text-anchor="middle" class="t">Rasterization</text><text x="1070" y="229" text-anchor="middle" class="s">fragments</text>
<path d="M1155 211H1190" class="line" marker-end="url(#arrow)"/>
<rect x="1200" y="164" width="205" height="94" rx="14" class="learned"/><text x="1302" y="201" text-anchor="middle" class="lt">Fragment Shader</text><text x="1302" y="227" text-anchor="middle" class="s">color / depth</text>
<path d="M1405 211H1440V360H1450" class="line" marker-end="url(#arrow)"/>
<rect x="1450" y="302" width="305" height="120" rx="18" class="group"/><text x="1475" y="332" class="s">Per-sample operations</text>
<rect x="1475" y="350" width="95" height="48" rx="11" class="box"/><text x="1522" y="380" text-anchor="middle" class="s">Depth</text>
<path d="M1570 374H1595" class="line" marker-end="url(#arrow)"/>
<rect x="1605" y="343" width="120" height="62" rx="12" class="learned"/><text x="1665" y="378" text-anchor="middle" class="lt">Blending</text>

<rect x="70" y="320" width="610" height="145" rx="18" class="current"/>
<text x="95" y="354" class="ct">Instancing · one mesh, many instances</text>
<text x="95" y="386" class="s">Mesh VBO → per-vertex attributes</text>
<text x="95" y="414" class="s">Instance VBO → offset / color / model matrix · divisor = 1</text>
<text x="95" y="442" class="note">glDraw*Instanced + gl_InstanceID · fewer CPU draw submissions</text>
<text x="572" y="341" class="tagCurrent">CURRENT</text>
<path d="M340 320V280" class="dash" marker-end="url(#barrow)"/>

<rect x="735" y="330" width="390" height="110" rx="15" class="learned"/>
<text x="760" y="362" class="lt">Advanced GLSL / UBO</text><text x="760" y="392" class="s">shader data interfaces · shared uniforms</text><text x="1005" y="351" class="tagLearned">LEARNED</text>
<rect x="1160" y="330" width="220" height="100" rx="14" class="learned"/><text x="1270" y="368" text-anchor="middle" class="lt">Cubemap</text><text x="1270" y="396" text-anchor="middle" class="s">shader resource</text>

<text x="70" y="505" class="s">Instancing is a draw/data-frequency technique, not a new fixed pipeline stage.</text>
<text x="70" y="533" class="note">The same VAO can contain attributes that advance per vertex and attributes that advance per instance.</text>
</svg>